name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: storeapp
          POSTGRES_USER: storeapp
          POSTGRES_PASSWORD: storeapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storeapp -d storeapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations are complete and apply cleanly
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Tests
        run: python -m pytest -q
